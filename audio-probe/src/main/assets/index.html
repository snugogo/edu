<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Audio Probe</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #0a0a0a;
    color: #00ff88;
    font-family: 'Courier New', monospace;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  body {
    display: flex;
    flex-direction: column;
    padding: 16px;
  }

  /* ── Header ── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 2px solid #00ff8833;
    margin-bottom: 12px;
    flex-shrink: 0;
  }
  .header h1 { font-size: 28px; font-weight: bold; letter-spacing: 2px; }
  .header .config {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .header label { font-size: 18px; color: #aaa; }
  .header select, .header input {
    background: #1a1a1a;
    color: #0ff;
    border: 2px solid #0ff;
    padding: 6px 10px;
    font-size: 18px;
    border-radius: 4px;
    font-family: 'Courier New', monospace;
  }
  .header select { min-width: 80px; }
  .header input { min-width: 260px; }

  /* ── Main area ── */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    overflow: hidden;
  }

  /* ── Record button ── */
  .btn-record {
    width: 200px; height: 200px;
    border-radius: 50%;
    border: 6px solid #ff4444;
    background: #1a0000;
    color: #ff4444;
    font-size: 32px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    flex-shrink: 0;
    font-family: 'Courier New', monospace;
    text-align: center;
    line-height: 1.2;
  }
  .btn-record:active, .btn-record.recording {
    background: #ff0000;
    color: #fff;
    border-color: #ff8888;
    box-shadow: 0 0 40px #ff0000aa;
    animation: pulse 0.5s ease-in-out infinite alternate;
  }
  .btn-record:focus-visible {
    outline: 4px solid #0ff;
    outline-offset: 4px;
  }
  @keyframes pulse {
    from { box-shadow: 0 0 20px #ff0000aa; }
    to   { box-shadow: 0 0 60px #ff0000; }
  }

  .mode-indicator {
    font-size: 18px;
    color: #ffaa00;
    flex-shrink: 0;
    text-align: center;
    min-height: 24px;
  }

  /* ── Log panel ── */
  .log-panel {
    flex: 1;
    width: 100%;
    background: #0d0d0d;
    border: 2px solid #00ff8833;
    border-radius: 8px;
    padding: 12px;
    overflow-y: auto;
    font-size: 20px;
    line-height: 1.5;
    min-height: 0;
  }
  .log-entry {
    padding: 4px 0;
    border-bottom: 1px solid #00ff8811;
  }
  .log-entry .ts { color: #666; margin-right: 12px; }
  .log-entry.info { color: #0ff; }
  .log-entry.ok   { color: #0f0; }
  .log-entry.warn { color: #ff0; }
  .log-entry.err  { color: #f44; }
  .log-entry.transcript {
    color: #fff;
    font-size: 28px;
    font-weight: bold;
    background: #00ff8811;
    padding: 8px;
    border-radius: 4px;
  }

  /* ── PASS/FAIL banner ── */
  .banner {
    width: 100%;
    padding: 16px;
    text-align: center;
    font-size: 48px;
    font-weight: bold;
    border-radius: 12px;
    flex-shrink: 0;
    display: none;
    letter-spacing: 4px;
  }
  .banner.pass {
    display: block;
    background: #003300;
    color: #00ff00;
    border: 4px solid #00ff00;
    box-shadow: 0 0 40px #00ff0044;
    animation: bannerPulse 1s ease-in-out infinite alternate;
  }
  .banner.fail {
    display: block;
    background: #330000;
    color: #ff0000;
    border: 4px solid #ff0000;
    box-shadow: 0 0 40px #ff000044;
  }
  @keyframes bannerPulse {
    from { box-shadow: 0 0 20px #00ff0044; }
    to   { box-shadow: 0 0 60px #00ff00aa; }
  }

  /* ── Scrollbar ── */
  .log-panel::-webkit-scrollbar { width: 10px; }
  .log-panel::-webkit-scrollbar-track { background: #0a0a0a; }
  .log-panel::-webkit-scrollbar-thumb { background: #00ff8833; border-radius: 5px; }
</style>
</head>
<body>

<!-- Header: title + config -->
<div class="header">
  <h1>🔊 AUDIO PROBE v1</h1>
  <div class="config">
    <label>Lang:</label>
    <select id="langSelect">
      <option value="pl" selected>PL</option>
      <option value="ro">RO</option>
      <option value="ru">RU</option>
      <option value="es">ES</option>
      <option value="zh">ZH</option>
    </select>
    <label>Server:</label>
    <input type="text" id="serverUrl" placeholder="https://..." />
  </div>
</div>

<!-- Main area -->
<div class="main">
  <!-- Interaction mode indicator -->
  <div class="mode-indicator" id="modeIndicator">Mode: HOLD-TO-SPEAK (hold button to record)</div>

  <!-- Big recording button -->
  <button class="btn-record" id="btnRecord" autofocus>HOLD<br>TO<br>SPEAK</button>

  <!-- Screen log panel -->
  <div class="log-panel" id="logPanel"></div>
</div>

<!-- PASS/FAIL banner -->
<div class="banner" id="banner"></div>

<script>
// ── State ──
let mediaStream = null;
let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;
let isToggleMode = false;  // false = hold-to-speak, true = toggle
let recordingStartTime = 0;
let probeCompleted = false;

// ── DOM refs ──
const btnRecord = document.getElementById('btnRecord');
const logPanel = document.getElementById('logPanel');
const banner   = document.getElementById('banner');
const langSelect = document.getElementById('langSelect');
const serverUrlInput = document.getElementById('serverUrl');
const modeIndicator = document.getElementById('modeIndicator');

// ── Init ──
function init() {
  // Set server URL from native bridge or default
  if (typeof AudioProbe !== 'undefined') {
    serverUrlInput.value = AudioProbe.getServerUrl();
  } else {
    serverUrlInput.value = 'https://tv.bvtuber.com/asr-probe-ab75e14a101c8779';
  }

  // Set up event listeners
  btnRecord.addEventListener('pointerdown', onPressStart);
  btnRecord.addEventListener('pointerup', onPressEnd);
  btnRecord.addEventListener('pointerleave', onPressEnd);
  btnRecord.addEventListener('pointercancel', onPressEnd);

  // Keyboard / D-pad support
  btnRecord.addEventListener('keydown', onKeyDown);
  btnRecord.addEventListener('keyup', onKeyUp);

  // Also listen on document for D-pad center (Enter) when button is focused
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && document.activeElement === btnRecord) {
      e.preventDefault();
      onPressStart();
    }
  });
  document.addEventListener('keyup', function(e) {
    if (e.key === 'Enter' && document.activeElement === btnRecord) {
      e.preventDefault();
      onPressEnd();
    }
  });

  // Server URL change → notify native bridge
  serverUrlInput.addEventListener('change', function() {
    if (typeof AudioProbe !== 'undefined') {
      AudioProbe.setServerUrl(this.value);
    }
    log('info', 'Server URL: ' + this.value);
  });

  log('info', '=== Audio Probe v1 Started ===');
  log('info', 'Origin: ' + window.location.origin);
  log('info', 'UA: ' + navigator.userAgent.substring(0, 80) + '...');
  log('info', 'Server: ' + serverUrlInput.value);

  // Check permission state
  checkPermissionState();
}

// ── Permission state ──
function checkPermissionState() {
  if (navigator.permissions && navigator.permissions.query) {
    navigator.permissions.query({ name: 'microphone' }).then(function(result) {
      log('info', 'Microphone permission: ' + result.state);
      result.addEventListener('change', function() {
        log('info', 'Microphone permission changed: ' + result.state);
      });
    }).catch(function(e) {
      log('warn', 'Permission query failed: ' + e.message);
    });
  } else {
    log('warn', 'Permissions API not available');
  }
}

// Called from native when RECORD_AUDIO permission result arrives
window.__audioProbeOnPermissionResult = function(granted) {
  log(granted ? 'ok' : 'err', 'RECORD_AUDIO permission: ' + (granted ? 'GRANTED' : 'DENIED'));
  if (!granted) {
    log('err', '⚠ 权限被拒，请去系统设置手动开启麦克风权限 (坑 #3)');
  }
};

// ── D-pad hold detection ──
let dpadHoldTimer = null;
let dpadHolding = false;

function onKeyDown(e) {
  if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
    e.preventDefault();
    if (!dpadHolding) {
      dpadHolding = true;
      // Short delay to distinguish click from hold
      dpadHoldTimer = setTimeout(function() {
        if (dpadHolding) {
          // Switch to toggle mode on first D-pad use
          if (!isToggleMode && !probeCompleted) {
            isToggleMode = true;
            updateModeIndicator();
            log('info', 'D-pad detected → switching to TOGGLE mode (坑 #7)');
          }
          onPressStart();
        }
      }, 300);
    }
  }
}

function onKeyUp(e) {
  if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
    e.preventDefault();
    dpadHolding = false;
    if (dpadHoldTimer) {
      clearTimeout(dpadHoldTimer);
      dpadHoldTimer = null;
    }
    if (isToggleMode) {
      // Toggle: press starts, press again stops
      if (!isRecording) {
        onPressStart();
      } else {
        onPressEnd();
      }
    } else {
      onPressEnd();
    }
  }
}

// ── Hold-to-speak ──
function onPressStart() {
  if (probeCompleted) return;

  if (isToggleMode) {
    if (!isRecording) {
      startRecording();
    }
    // Stop handled in onKeyUp for toggle
  } else {
    // Hold-to-speak: start immediately on press
    if (!isRecording) {
      startRecording();
    }
  }
}

function onPressEnd() {
  if (probeCompleted) return;

  if (!isToggleMode && isRecording) {
    // Hold-to-speak: stop on release
    stopRecording();
  }
  // Toggle stop is handled in onKeyUp
}

// ── Recording ──
function startRecording() {
  if (isRecording) return;

  log('info', '--- Starting recording ---');

  // Check getUserMedia support
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    log('err', 'getUserMedia not available — secure context? (坑 #2)');
    setResult('FAIL');
    return;
  }

  navigator.mediaDevices.getUserMedia({ audio: true })
    .then(function(stream) {
      log('ok', 'getUserMedia SUCCESS');
      mediaStream = stream;

      // Detect supported mimeType (坑 #4)
      var mimeType = null;
      var typesToTry = [
        'audio/webm;codecs=opus',
        'audio/webm',
        'audio/ogg;codecs=opus',
        'audio/mp4'
      ];
      for (var i = 0; i < typesToTry.length; i++) {
        if (MediaRecorder.isTypeSupported(typesToTry[i])) {
          mimeType = typesToTry[i];
          break;
        }
      }
      log('info', 'MediaRecorder mimeType: ' + (mimeType || 'default'));

      // Create MediaRecorder
      audioChunks = [];
      var opts = mimeType ? { mimeType: mimeType } : {};
      try {
        mediaRecorder = new MediaRecorder(stream, opts);
      } catch(e) {
        log('warn', 'MediaRecorder with mimeType failed, using default: ' + e.message);
        mediaRecorder = new MediaRecorder(stream);
      }

      mediaRecorder.ondataavailable = function(e) {
        if (e.data && e.data.size > 0) {
          audioChunks.push(e.data);
        }
      };

      mediaRecorder.onstop = function() {
        var blob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
        var durationSec = (Date.now() - recordingStartTime) / 1000;
        log('info', 'Recording stopped');
        log('info', 'Blob: ' + blob.size + ' bytes, ' + durationSec.toFixed(1) + 's, type: ' + blob.type);
        uploadAudio(blob);
      };

      mediaRecorder.onerror = function(e) {
        log('err', 'MediaRecorder error: ' + JSON.stringify(e));
        setResult('FAIL');
      };

      mediaRecorder.start(250); // timeslice every 250ms
      recordingStartTime = Date.now();
      isRecording = true;
      btnRecord.classList.add('recording');
      btnRecord.textContent = '●\nREC';
      log('info', 'Recording STARTED');

    })
    .catch(function(err) {
      log('err', 'getUserMedia FAILED');
      log('err', 'error.name: ' + err.name);
      log('err', 'error.message: ' + err.message);

      if (err.name === 'NotAllowedError') {
        log('err', '⚠ 可能原因: onPermissionRequest 没 grant (坑 #1) / file:// 安全上下文 (坑 #2)');
      } else if (err.name === 'NotFoundError') {
        log('err', '⚠ 未找到麦克风设备 — 硬件问题');
      }

      setResult('FAIL');
    });
}

function stopRecording() {
  if (!isRecording) return;

  try {
    mediaRecorder.stop();
  } catch(e) {
    log('warn', 'MediaRecorder.stop error: ' + e.message);
  }

  // Stop all tracks
  if (mediaStream) {
    mediaStream.getTracks().forEach(function(track) { track.stop(); });
    mediaStream = null;
  }

  isRecording = false;
  btnRecord.classList.remove('recording');
  btnRecord.textContent = 'HOLD\nTO\nSPEAK';
}

// ── Upload to VPS ──
function uploadAudio(blob) {
  var serverUrl = serverUrlInput.value.trim();
  // WO-AUDIO-PROBE-ENDPOINT-FIX: endpoint IS the server URL (path includes token)
  var endpoint = serverUrl.replace(/\/$/, '');
  var language = langSelect.value;

  log('info', 'Uploading to: ' + endpoint);
  log('info', 'Language: ' + language);

  var uploadStartTime = Date.now();
  var formData = new FormData();
  formData.append('audio', blob, 'recording.' + (blob.type.includes('webm') ? 'webm' : 'ogg'));
  formData.append('language', language);

  fetch(endpoint, {
    method: 'POST',
    body: formData
  })
  .then(function(response) {
    var uploadMs = Date.now() - uploadStartTime;
    log('info', 'Upload HTTP status: ' + response.status + ' (' + uploadMs + 'ms)');

    if (response.status === 0) {
      log('err', '⚠ HTTP 0 — likely CORS blocked (坑 #5). Origin: ' + window.location.origin);
      setResult('FAIL');
      return Promise.reject('CORS');
    }

    return response.json().then(function(data) {
      data._httpStatus = response.status;
      data._uploadMs = uploadMs;
      return data;
    });
  })
  .then(function(data) {
    if (data.error) {
      log('err', 'ASR error: ' + data.error);
      setResult('FAIL');
    } else if (data.transcript !== undefined && data.transcript !== null && data.transcript !== '') {
      log('transcript', 'Transcription: "' + data.transcript + '"');
      log('ok', 'ASR latency: ' + data.latencyMs + 'ms (upload: ' + data._uploadMs + 'ms)');
      log('ok', 'Provider: ' + data.provider + ', language: ' + (data.language || 'N/A'));
      setResult('PASS');
    } else {
      log('warn', 'Empty transcript received (silence or unrecognized speech)');
      log('info', 'Raw response: ' + JSON.stringify(data));
      setResult('FAIL');
    }
  })
  .catch(function(err) {
    if (err === 'CORS') return; // already handled
    log('err', 'Upload/ASR request failed: ' + err.message);
    log('err', '⚠ Check: network / CORS (坑 #5) / endpoint not running');
    setResult('FAIL');
  });
}

// ── Result ──
function setResult(result) {
  probeCompleted = true;
  banner.className = 'banner ' + result.toLowerCase();
  banner.textContent = result === 'PASS' ? '✅ PASS — Audio pipeline working' : '❌ FAIL — Check log above';
  log(result === 'PASS' ? 'ok' : 'err', '=== FINAL: ' + result + ' ===');

  // Reset button
  btnRecord.classList.remove('recording');
  btnRecord.textContent = result === 'PASS' ? 'PASS' : 'FAIL';
  btnRecord.style.borderColor = result === 'PASS' ? '#0f0' : '#f00';
  btnRecord.style.color = result === 'PASS' ? '#0f0' : '#f00';
  btnRecord.style.background = result === 'PASS' ? '#001a00' : '#1a0000';
  btnRecord.style.animation = 'none';
}

// ── Logging ──
function log(cls, msg) {
  var now = new Date();
  var ts = now.getHours().toString().padStart(2,'0') + ':'
         + now.getMinutes().toString().padStart(2,'0') + ':'
         + now.getSeconds().toString().padStart(2,'0') + '.'
         + now.getMilliseconds().toString().padStart(3,'0');

  var entry = document.createElement('div');
  entry.className = 'log-entry ' + cls;
  entry.innerHTML = '<span class="ts">[' + ts + ']</span>' + escapeHtml(msg);
  logPanel.appendChild(entry);
  logPanel.scrollTop = logPanel.scrollHeight;

  // Also log to native bridge if available
  if (typeof AudioProbe !== 'undefined') {
    try { AudioProbe.logcat(cls, msg); } catch(e) {}
  }
}

function escapeHtml(str) {
  var div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ── Mode indicator ──
function updateModeIndicator() {
  modeIndicator.textContent = 'Mode: ' + (isToggleMode ? 'TOGGLE (press once to start, again to stop)' : 'HOLD-TO-SPEAK (hold button to record)');
}

// ── Boot ──
init();
</script>
</body>
</html>
