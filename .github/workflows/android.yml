name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Set up Android SDK
        uses: android-actions/setup-android@v2
        
      - name: Build Edu Terminal APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
          
      - name: Upload Edu Terminal APK
        uses: actions/upload-artifact@v4
        with:
          name: edu-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Build Audio Probe APK
        run: |
          ./gradlew :audio-probe:assembleDebug --no-daemon
          
      - name: Upload Audio Probe APK
        uses: actions/upload-artifact@v4
        with:
          name: audio-probe-apk
          path: audio-probe/build/outputs/apk/debug/audio-probe-debug.apk
